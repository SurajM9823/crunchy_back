<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crunchy RMS — Superuser Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #f97316;
            --primary-hover: #ea580c;
            --primary-light: #ffedd5;
            --dark-bg: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --danger-bg: rgba(239, 68, 68, 0.12);
            --success: #10b981;
            --focus-ring: rgba(249, 115, 22, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a 60%, #020617);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .login-wrapper {
            width: 100%;
            max-width: 460px;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 9999px;
            background: rgba(249, 115, 22, 0.12);
            border: 1px solid rgba(249, 115, 22, 0.3);
            color: #fb923c;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 14px;
        }

        .brand-badge .pulse-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #f97316;
            box-shadow: 0 0 10px #f97316;
        }

        .brand-header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .brand-header p {
            color: var(--text-muted);
            font-size: 14px;
        }

        .login-card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 36px 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
        }

        .alert-box {
            padding: 14px 16px;
            border-radius: 12px;
            margin-bottom: 22px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .alert-danger {
            background: var(--danger-bg);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        label {
            font-size: 13.5px;
            font-weight: 600;
            color: #e2e8f0;
        }

        .id-type-tag {
            font-size: 11px;
            font-weight: 600;
            color: #fdba74;
            background: rgba(249, 115, 22, 0.15);
            padding: 2px 8px;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .input-container {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 13px 14px 13px 44px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            font-size: 14.5px;
            color: #fff;
            transition: border-color 0.2s, box-shadow 0.2s;
            font-family: inherit;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--focus-ring);
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
        }

        .toggle-password:hover {
            color: var(--text-main);
        }

        .supported-chips {
            display: flex;
            gap: 6px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .chip {
            font-size: 11.5px;
            color: #94a3b8;
            background: rgba(255, 255, 255, 0.04);
            padding: 3px 8px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .remember-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            font-size: 13.5px;
            color: var(--text-muted);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .checkbox-group input {
            cursor: pointer;
            accent-color: var(--primary);
            width: 16px;
            height: 16px;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            box-shadow: 0 10px 20px -5px rgba(249, 115, 22, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .submit-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 14px 26px -5px rgba(249, 115, 22, 0.5);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .card-footer {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12.5px;
            color: var(--text-muted);
        }

        .card-footer a {
            color: #fb923c;
            text-decoration: none;
            font-weight: 600;
        }

        .card-footer a:hover {
            text-decoration: underline;
        }

        .badge-live {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: #34d399;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="brand-header">
            <div class="brand-badge">
                <span class="pulse-dot"></span>
                Crunchy RMS &bull; Operations
            </div>
            <h1>Superuser Portal</h1>
            <p>Unified access for Restaurant Superadmins &amp; Managers</p>
        </div>

        <div class="login-card">
            {% if error_message %}
            <div class="alert-box alert-danger">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <span>{{ error_message }}</span>
            </div>
            {% endif %}

            <form method="POST" action="{% url 'superuser-login' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}">
                {% csrf_token %}

                <div class="form-group">
                    <div class="form-label-row">
                        <label for="identifier">Login Identifier</label>
                        <span class="id-type-tag" id="idTypeBadge">Auto-Detecting</span>
                    </div>
                    <div class="input-container">
                        <svg class="input-icon" id="idIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <input
                            type="text"
                            id="identifier"
                            name="identifier"
                            value="{{ identifier|default:'' }}"
                            placeholder="Phone (+1234567890), Email, or Username"
                            required
                            autofocus
                            autocomplete="username"
                        >
                    </div>
                    <div class="supported-chips">
                        <span class="chip">📞 Phone Number</span>
                        <span class="chip">✉️ Email Address</span>
                        <span class="chip">👤 Username</span>
                    </div>
                </div>

                <div class="form-group">
                    <div class="form-label-row">
                        <label for="password">Password</label>
                    </div>
                    <div class="input-container">
                        <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your secure password"
                            required
                            autocomplete="current-password"
                        >
                        <button type="button" class="toggle-password" id="togglePasswordBtn" aria-label="Toggle password visibility">
                            <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="remember-row">
                    <label class="checkbox-group">
                        <input type="checkbox" name="remember_me" checked>
                        <span>Stay signed in</span>
                    </label>
                    <a href="/admin/password_reset/" style="color: #94a3b8; text-decoration: none; font-size: 13px;">Forgot?</a>
                </div>

                <button type="submit" class="submit-btn">
                    <span>Sign In to Superuser Portal</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>
            </form>

            <div class="card-footer">
                <span class="badge-live">
                    <span style="width: 6px; height: 6px; border-radius: 50%; background: #10b981;"></span>
                    Channels &bull; Celery Active
                </span>
                <a href="/admin/">Django Admin &rarr;</a>
            </div>
        </div>
    </div>

    <script>
        const idInput = document.getElementById('identifier');
        const idBadge = document.getElementById('idTypeBadge');
        const passwordInput = document.getElementById('password');
        const toggleBtn = document.getElementById('togglePasswordBtn');

        // Dynamic identifier type detection
        idInput.addEventListener('input', function() {
            const val = this.value.trim();
            if (!val) {
                idBadge.textContent = 'Auto-Detecting';
                idBadge.style.color = '#fdba74';
                return;
            }

            if (val.includes('@')) {
                idBadge.textContent = '✉️ Email Detected';
                idBadge.style.color = '#60a5fa';
            } else if (/^[\d+\-\(\)\s]+$/.test(val) && val.replace(/\D/g, '').length >= 7) {
                idBadge.textContent = '📞 Phone Detected';
                idBadge.style.color = '#34d399';
            } else {
                idBadge.textContent = '👤 Username Detected';
                idBadge.style.color = '#fb923c';
            }
        });

        // Toggle password visibility
        toggleBtn.addEventListener('click', function() {
            const isPassword = passwordInput.getAttribute('type') === 'password';
            passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
            this.style.color = isPassword ? '#f97316' : '#94a3b8';
        });

        // Initial trigger
        idInput.dispatchEvent(new Event('input'));
    </script>
</body>
</html>
